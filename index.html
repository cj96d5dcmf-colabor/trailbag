<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrailBag - Mountain Equipment & Nutrition</title>
  <style>
    :root {
      --bg-dark: #121614;
      --card-bg: #1c2820;
      --card-border: #2a382e;
      --accent-orange: #e07a5f;
      --accent-green: #8ba888;
      --text-main: #f2ede4;
      --text-muted: #a3b0a2;
      --input-bg: #16201a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 70px;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      color: var(--accent-orange);
    }

    .lang-selector {
      display: flex;
      gap: 4px;
      background-color: var(--bg-dark);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
    }

    .lang-btn.active {
      background-color: var(--accent-orange);
      color: #fff;
    }

    .weight-summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
      background-color: var(--bg-dark);
    }

    .weight-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }

    .weight-card.highlight {
      border-color: var(--accent-orange);
    }

    .weight-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .weight-value {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .weight-value span {
      font-size: 0.75rem;
      color: var(--accent-green);
    }

    .view-content {
      display: none;
      padding: 0 16px 16px 16px;
    }

    .view-content.active {
      display: block;
    }

    .brand-catalog-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .brand-catalog-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-green);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .catalog-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .catalog-select {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    /* Cuadrícula Visual de Identidad de Marca */
    .brand-grid-visual {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 6px;
      display: none;
    }

    .brand-logo-btn {
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-btn.selected {
      background-color: var(--accent-green);
      color: var(--bg-dark);
      border-color: var(--accent-green);
    }

    .btn-add-preset {
      width: 100%;
      background-color: var(--accent-orange);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-pill.active {
      background-color: var(--accent-green);
      color: var(--bg-dark);
      border-color: var(--accent-green);
      font-weight: 700;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .item-card.selected {
      border-color: var(--accent-green);
      background-color: #213026;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--input-bg);
    }

    .item-card.selected .custom-checkbox {
      background-color: var(--accent-green);
      border-color: var(--accent-green);
    }

    .item-card.selected .custom-checkbox::after {
      content: "✓";
      color: var(--bg-dark);
      font-size: 0.85rem;
      font-weight: 900;
    }

    .item-info {
      display: flex;
      flex-direction: column;
    }

    .item-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .item-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-weight {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-orange);
    }

    .delete-item-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 4px;
    }

    .add-item-btn {
      width: 100%;
      background-color: transparent;
      border: 2px dashed var(--card-border);
      color: var(--accent-green);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .nutrition-results {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .nutri-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
      text-align: center;
    }

    .nutri-box {
      background-color: var(--input-bg);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .nutri-title {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .nutri-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-orange);
      margin-top: 4px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--card-bg);
      border-top: 1px solid var(--card-border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 8px 0;
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent-orange);
    }

    .nav-icon {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">🌲 Trail<span>Bag</span></div>
    <div class="lang-selector">
      <button class="lang-btn active" onclick="setLanguage('es')">ES</button>
      <button class="lang-btn" onclick="setLanguage('eu')">EU</button>
      <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>
  </header>

  <section class="weight-summary">
    <div class="weight-card">
      <div class="weight-label" id="lbl-base-weight">Peso Material</div>
      <div class="weight-value"><span id="val-base-weight">0</span> <span>g</span></div>
    </div>
    <div class="weight-card">
      <div class="weight-label" id="lbl-nutri-weight">Peso Nutrición</div>
      <div class="weight-value"><span id="val-nutri-weight">0</span> <span>g</span></div>
    </div>
    <div class="weight-card highlight">
      <div class="weight-label" id="lbl-total-weight">Peso Total</div>
      <div class="weight-value"><span id="val-total-weight">0</span> <span>g</span></div>
    </div>
  </section>

  <!-- PESTAÑA 1: MOCHILA Y MATERIAL -->
  <main id="view-mochila" class="view-content active">
    
    <div class="brand-catalog-card">
      <div class="brand-catalog-title" id="lbl-gear-catalog">🎒 Catálogo de Material & Equipamiento</div>
      <div class="catalog-stack">
        <select class="catalog-select" id="select-gear-category" onchange="onGearCategoryChange()">
          <option value="">1. Elige Tipo de Equipamiento...</option>
          <option value="mochilas">🎒 Mochilas y Chalecos</option>
          <option value="ropa">🧥 Ropa y Chaquetas Impermeables</option>
          <option value="seguridad">🔦 Frontales y Seguridad</option>
          <option value="hidratacion_hardware">💧 Bidones y Bolsas (Vacíos)</option>
          <option value="bastones">🥢 Bastones de Trekking</option>
        </select>

        <div class="brand-grid-visual" id="gear-brand-grid"></div>

        <select class="catalog-select" id="select-gear-model" disabled>
          <option value="">3. Elige Modelo Específico...</option>
        </select>
      </div>
      <button class="btn-add-preset" onclick="addGearItem()" id="btn-add-gear">+ Añadir Equipamiento</button>
    </div>

    <div class="category-scroll">
      <button class="cat-pill active" onclick="filterCategory('all')" id="cat-all">Todos</button>
      <button class="cat-pill" onclick="filterCategory('ropa')" id="cat-ropa">Ropa & Abrigo</button>
      <button class="cat-pill" onclick="filterCategory('seguridad')" id="cat-seguridad">Seguridad</button>
      <button class="cat-pill" onclick="filterCategory('hidratacion')" id="cat-hidratacion">Hidratación</button>
      <button class="cat-pill" onclick="filterCategory('bastones')" id="cat-bastones">Bastones/Varios</button>
    </div>

    <div class="item-list" id="equipment-container"></div>

    <button class="add-item-btn" onclick="addNewItemPrompt(false)" id="btn-add-item">+ Añadir Material Personalizado</button>
  </main>

  <!-- PESTAÑA 2: NUTRICIÓN -->
  <main id="view-nutricion" class="view-content">
    
    <div class="brand-catalog-card">
      <div class="brand-catalog-title" id="lbl-nutri-catalog">⚡ Catálogo de Nutrición Deportiva</div>
      <div class="catalog-stack">
        <select class="catalog-select" id="select-nutri-category" onchange="onNutriCategoryChange()">
          <option value="">1. Elige Tipo de Suplemento...</option>
          <option value="geles">🧪 Geles Energéticos</option>
          <option value="barritas">🍫 Barritas Energéticas</option>
          <option value="bebidas">🥤 Bebidas e Hidratos en Polvo</option>
          <option value="sales">🧂 Sales y Electrolitos</option>
        </select>

        <div class="brand-grid-visual" id="nutri-brand-grid"></div>

        <select class="catalog-select" id="select-nutri-model" disabled>
          <option value="">3. Elige Producto / Gel...</option>
        </select>
      </div>
      <button class="btn-add-preset" onclick="addNutriItem()" id="btn-add-nutri">+ Añadir Nutrición a la Carga</button>
    </div>

    <div class="nutrition-results">
      <div class="form-group">
        <label id="lbl-user-weight">Peso del Corredor (kg):</label>
        <input type="number" id="input-weight" value="70" oninput="calculateNutrition()">
      </div>
      <div class="form-group">
        <label id="lbl-route-dist">Distancia de Ruta (km):</label>
        <input type="number" id="input-dist" value="42" oninput="calculateNutrition()">
      </div>
      <div class="form-group">
        <label id="lbl-est-time">Tiempo Estimado (horas):</label>
        <input type="number" id="input-time" value="6" oninput="calculateNutrition()">
      </div>

      <div class="nutri-grid">
        <div class="nutri-box">
          <div class="nutri-title" id="lbl-carbs">CH Objetivo</div>
          <div class="nutri-val"><span id="val-carbs">60</span> <small>g/h</small></div>
        </div>
        <div class="nutri-box">
          <div class="nutri-title" id="lbl-water">Agua</div>
          <div class="nutri-val"><span id="val-water">500</span> <small>ml/h</small></div>
        </div>
        <div class="nutri-box">
          <div class="nutri-title" id="lbl-sodium">Sodio / Sales</div>
          <div class="nutri-val"><span id="val-sodium">600</span> <small>mg/h</small></div>
        </div>
      </div>

      <div class="nutri-grid" style="margin-top: 12px; border-top: 1px dashed var(--card-border); padding-top: 12px;">
        <div class="nutri-box">
          <div class="nutri-title">CH Cubiertos</div>
          <div class="nutri-val" style="color: var(--accent-green);"><span id="val-carbs-loaded">0</span> <small>g tot</small></div>
        </div>
        <div class="nutri-box">
          <div class="nutri-title">Sodio Cubierto</div>
          <div class="nutri-val" style="color: var(--accent-green);"><span id="val-sodium-loaded">0</span> <small>mg tot</small></div>
        </div>
        <div class="nutri-box">
          <div class="nutri-title">Estado Carga</div>
          <div class="nutri-val" style="font-size:0.85rem;" id="val-nutri-status">Pendiente</div>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('mochila')" id="nav-mochila">
      <span class="nav-icon">🎒</span>
      <span id="nav-lbl-mochila">Mochila</span>
    </button>
    <button class="nav-btn" onclick="switchTab('nutricion')" id="nav-nutricion">
      <span class="nav-icon">🧪</span>
      <span id="nav-lbl-nutricion">Nutrición</span>
    </button>
  </nav>

    function init() {
      renderEquipment();
      calculateWeights();
      calculateNutrition();

    function onGearCategoryChange() {
      const catKey = document.getElementById('select-gear-category').value;
      const brandGrid = document.getElementById('gear-brand-grid');
      const modelSelect = document.getElementById('select-gear-model');

      brandGrid.innerHTML = '';
      modelSelect.innerHTML = '<option value="">3. Elige Modelo Específico...</option>';
      modelSelect.disabled = true;
      selectedGearBrand = null;

      if (!catKey || !gearCatalog[catKey]) {
        brandGrid.style.display = 'none';
        return;
      }

      brandGrid.style.display = 'grid';
      Object.keys(gearCatalog[catKey]).forEach(brand => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'brand-logo-btn';
        btn.textContent = brand;
        btn.onclick = () => selectGearBrand(catKey, brand, btn);
        brandGrid.appendChild(btn);
      });
    }

    function selectGearBrand(catKey, brand, btnElement) {
      document.querySelectorAll('#gear-brand-grid .brand-logo-btn').forEach(b => b.classList.remove('selected'));
      btnElement.classList.add('selected');
      selectedGearBrand = brand;

      const modelSelect = document.getElementById('select-gear-model');
      modelSelect.innerHTML = '<option value="">3. Elige Modelo Específico...</option>';
      modelSelect.disabled = false;

      gearCatalog[catKey][brand].forEach((mod, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${mod.name} (${mod.weight}g)`;
        modelSelect.appendChild(opt);
      });
    }

    function addGearItem() {
      const catKey = document.getElementById('select-gear-category').value;
      const modelIndex = document.getElementById('select-gear-model').value;

      if (!catKey || !selectedGearBrand || modelIndex === "") return;

      const modelData = gearCatalog[catKey][selectedGearBrand][modelIndex];
      const newItem = {
        id: Date.now(),
        name: `${selectedGearBrand} ${modelData.name}`,
        weight: modelData.weight,
        category: catKey === 'mochilas' ? 'bastones' : (catKey === 'hidratacion_hardware' ? 'hidratacion' : catKey),
        selected: true,
        consumable: false,
        carbs: 0,
        sodium: 0
      };

      items.push(newItem);
      renderEquipment();
      calculateWeights();
      calculateNutrition();
    }

      const catKey = document.getElementById('select-nutri-category').value;
      const brandGrid = document.getElementById('nutri-brand-grid');

    function addNutriItem() {
      const catKey = document.getElementById('select-nutri-category').value;

      if (!catKey || !selectedNutriBrand || modelIndex === "") return;

      const modelData = nutriCatalog[catKey][selectedNutriBrand][modelIndex];

        category: "nutricion",

        consumable: true,
        carbs: modelData.carbs || 0,
        sodium: modelData.sodium || 0

      items.push(newItem);
      renderEquipment();
      calculateWeights();
      calculateNutrition();

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById('nav-lbl-nutricion').textContent = dict.navNutricion;

      renderEquipment();
    }

    function renderEquipment() {
      const container = document.getElementById('equipment-container');
      container.innerHTML = '';

      items.forEach(item => {
        if (currentCategory !== 'all' && item.category !== currentCategory) return;

        const nameText = typeof item.name === 'object' ? (item.name[currentLang] || item.name.es) : item.name;

        const card = document.createElement('div');
        card.className = `item-card ${item.selected ? 'selected' : ''}`;
        
        card.innerHTML = `
          <div class="item-left" onclick="toggleItem(${item.id})">
            <div class="custom-checkbox"></div>
            <div class="item-info">
              <div class="item-name">${nameText}</div>
              <div class="item-tag">${item.consumable ? 'Nutrición / Agua' : 'Material Base'} ${item.carbs ? '| ' + item.carbs + 'g CH' : ''}</div>
            </div>
          </div>
          <div class="item-right">
            <span class="item-weight">${item.weight} g</span>
            <button class="delete-item-btn" onclick="deleteItem(${item.id})">✕</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleItem(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.selected = !item.selected;
        renderEquipment();
        calculateWeights();
        calculateNutrition();
      }
    }

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      renderEquipment();
      calculateWeights();
      calculateNutrition();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(pill => pill.classList.remove('active'));
      event.target.classList.add('active');
      renderEquipment();
    }

    function calculateWeights() {
      let gearWeight = 0;
      let nutriWeight = 0;
      let totalWeight = 0;

      items.forEach(item => {
        if (item.selected) {
          totalWeight += item.weight;
          if (item.consumable) {
            nutriWeight += item.weight;
          } else {
            gearWeight += item.weight;
          }
        }
      });

      document.getElementById('val-base-weight').textContent = gearWeight;
      document.getElementById('val-nutri-weight').textContent = nutriWeight;
      document.getElementById('val-total-weight').textContent = totalWeight;
    }

    function calculateNutrition() {
      const weight = parseFloat(document.getElementById('input-weight').value) || 70;
      const hours = parseFloat(document.getElementById('input-time').value) || 1;

      const targetCarbsPerHour = Math.min(90, Math.max(30, Math.round(weight * 0.85)));
      const water = Math.round(weight * 7.5);
      const sodium = 600;

      const totalTargetCarbs = targetCarbsPerHour * hours;

      let loadedCarbs = 0;
      let loadedSodium = 0;

      items.forEach(item => {
        if (item.selected) {
          loadedCarbs += item.carbs || 0;
          loadedSodium += item.sodium || 0;
        }
      });

      document.getElementById('val-carbs').textContent = targetCarbsPerHour;
      document.getElementById('val-water').textContent = water;
      document.getElementById('val-sodium').textContent = sodium;

      document.getElementById('val-carbs-loaded').textContent = loadedCarbs;
      document.getElementById('val-sodium-loaded').textContent = loadedSodium;

      const statusEl = document.getElementById('val-nutri-status');
      if (loadedCarbs >= totalTargetCarbs) {
        statusEl.textContent = "OK (Cubierto)";
        statusEl.style.color = "var(--accent-green)";
      } else {
        statusEl.textContent = `Faltan ${totalTargetCarbs - loadedCarbs}g`;
        statusEl.style.color = "var(--accent-orange)";
      }
    }

    function addNewItemPrompt(isNutri) {
      const dict = i18n[currentLang];
      const name = prompt(dict.promptName);
      if (!name) return;
      const weight = parseInt(prompt(dict.promptWeight, "100"));
      if (isNaN(weight)) return;

      const newItem = {
        id: Date.now(),
        name: name,
      weight: weight,
        category: isNutri ? "nutricion" : "bastones",
        selected: true,
        consumable: isNutri,
        carbs: 0,
        sodium: 0
      };

      items.push(newItem);
      renderEquipment();
      calculateWeights();
      calculateNutrition();
    }

    function switchTab(tab) {
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      if (tab === 'mochila') {
        document.getElementById('view-mochila').classList.add('active');
        document.getElementById('nav-mochila').classList.add('active');
      } else {
        document.getElementById('view-nutricion').classList.add('active');
        document.getElementById('nav-nutricion').classList.add('active');
      }
    }

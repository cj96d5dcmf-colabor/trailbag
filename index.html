<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrailBag — Gestión de Equipamiento y Nutrición</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --warning-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-color);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Accordion Styles */
    .accordion-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .accordion-header {
      width: 100%;
      padding: 16px;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .accordion-content {
      display: none;
      padding: 16px;
      border-top: 1px solid var(--border-color);
      background-color: rgba(15, 23, 42, 0.4);
    }

    .accordion-item.active .accordion-content {
      display: block;
    }

    /* Selector Grid */
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .brand-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }

    .brand-btn.selected {
      border-color: var(--accent-color);
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--accent-color);
    }

    .product-select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.9rem;
      margin-bottom: 12px;
      outline: none;
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .add-btn:active {
      background-color: var(--accent-hover);
    }

    /* Items List */
    .item-list {
      margin-top: 12px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.1rem;
      cursor: pointer;
      margin-left: 8px;
    }

    /* Floating Summary Bar */
    .summary-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 2px;
    }

    .stat-value.highlight {
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>TrailBag — Mochila & Nutrición</h1>
  </header>

  <div class="container">
    
    <!-- 1. MOCHILAS Y PORTABILIDAD -->
    <div class="accordion-item">
      <button class="accordion-header" onclick="toggleAccordion(this)">
        <span>🎒 1. Mochilas y Chalecos</span>
        <span class="badge" id="badge-backpacks">0g</span>
      </button>
      <div class="accordion-content">
        <div class="brand-grid" id="brands-backpacks"></div>
        <select class="product-select" id="select-backpacks">
          <option value="">Selecciona una marca primero...</option>
        </select>
        <button class="add-btn" onclick="addItem('backpacks')">+ Añadir a la Mochila</button>
        <div class="item-list" id="list-backpacks"></div>
      </div>
    </div>

    <!-- 2. MATERIAL OBLIGATORIO -->
    <div class="accordion-item">
      <button class="accordion-header" onclick="toggleAccordion(this)">
        <span>🛡️ 2. Material Obligatorio</span>
        <span class="badge" id="badge-gear">0g</span>
      </button>
      <div class="accordion-content">
        <div class="brand-grid" id="brands-gear"></div>
        <select class="product-select" id="select-gear">
          <option value="">Selecciona una marca primero...</option>
        </select>
        <button class="add-btn" onclick="addItem('gear')">+ Añadir a la Mochila</button>
        <div class="item-list" id="list-gear"></div>
      </div>
    </div>

    <!-- 3. NUTRICIÓN E HIDRATACIÓN -->
    <div class="accordion-item">
      <button class="accordion-header" onclick="toggleAccordion(this)">
        <span>⚡ 3. Nutrición e Hidratación</span>
        <span class="badge" id="badge-nutrition">0g | 0g CH</span>
      </button>
      <div class="accordion-content">
        <div class="brand-grid" id="brands-nutrition"></div>
        <select class="product-select" id="select-nutrition">
          <option value="">Selecciona una marca primero...</option>
        </select>
        <button class="add-btn" onclick="addItem('nutrition')">+ Añadir a la Mochila</button>
        <div class="item-list" id="list-nutrition"></div>
      </div>
    </div>

  </div>

  <!-- Barra Fija Inferior -->
  <div class="summary-bar">
    <div class="stat-box">
      <div class="stat-label">Peso Total</div>
      <div class="stat-value highlight" id="total-weight">0 g</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Carga Hidratos</div>
      <div class="stat-value" id="total-carbs">0 g CH</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Sodio Total</div>
      <div class="stat-value" id="total-sodium">0 mg</div>
    </div>
  </div>

  <script>
    // Base de datos ligera de marcas y productos preset
    const DB = {
      backpacks: {
        "Salomon": [
          { name: "Sense Pro 5", weight: 144, carbs: 0, sodium: 0 },
          { name: "Active Skin 8", weight: 213, carbs: 0, sodium: 0 }
        ],
        "RaidLight": [
          { name: "Responsiv 12L", weight: 200, carbs: 0, sodium: 0 }
        ],
        "Compressport": [
          { name: "Ultralight Pack 10L", weight: 117, carbs: 0, sodium: 0 }
        ],
        "Nnormal": [
          { name: "Race Vest 5L", weight: 150, carbs: 0, sodium: 0 }
        ]
      },
      gear: {
        "Salomon": [
          { name: "Chaqueta Bonatti Trail", weight: 195, carbs: 0, sodium: 0 }
        ],
        "RaidLight": [
          { name: "Chaqueta Ultralight MP+", weight: 150, carbs: 0, sodium: 0 }
        ],
        "Petzl": [
          { name: "Frontal Nao RL", weight: 145, carbs: 0, sodium: 0 },
          { name: "Frontal Swift RL", weight: 100, carbs: 0, sodium: 0 }
        ],
        "Black Diamond": [
          { name: "Frontal Sprint 225", weight: 56, carbs: 0, sodium: 0 }
        ]
      },
      nutrition: {
        "226ERS": [
          { name: "High Energy Gel (50g CH)", weight: 76, carbs: 50, sodium: 250 },
          { name: "Isotonic Gel (22g CH)", weight: 68, carbs: 22, sodium: 100 }
        ],
        "Maurten": [
          { name: "GEL 100 (25g CH)", weight: 40, carbs: 25, sodium: 20 },
          { name: "GEL 160 (40g CH)", weight: 65, carbs: 40, sodium: 30 }
        ],
        "Fanté": [
          { name: "GEL GLUT 5 (80g CH)", weight: 100, carbs: 80, sodium: 350 }
        ],
        "Naäk": [
          { name: "Ultra Energy Gel (27g CH)", weight: 50, carbs: 27, sodium: 140 },
          { name: "Ultra Energy Bar (28g CH)", weight: 50, carbs: 28, sodium: 160 }
        ],
        "SiS": [
          { name: "GO Isotonic Gel (22g CH)", weight: 60, carbs: 22, sodium: 10 }
        ]
      }
    };

    let userState = {
      backpacks: [],
      gear: [],
      nutrition: []
    };

    let selectedBrands = {
      backpacks: null,
      gear: null,
      nutrition: null
    };

    function init() {
      renderBrandButtons('backpacks');
      renderBrandButtons('gear');
      renderBrandButtons('nutrition');
    }

    function toggleAccordion(button) {
      const item = button.parentElement;
      item.classList.toggle('active');
    }

    function renderBrandButtons(category) {
      const container = document.getElementById(`brands-${category}`);
      container.innerHTML = '';
      const brands = Object.keys(DB[category]);

      brands.forEach(brand => {
        const btn = document.createElement('button');
        btn.className = `brand-btn ${selectedBrands[category] === brand ? 'selected' : ''}`;
        btn.textContent = brand;
        btn.onclick = () => selectBrand(category, brand);
        container.appendChild(btn);
      });
    }

    function selectBrand(category, brand) {
      selectedBrands[category] = brand;
      renderBrandButtons(category);

      const select = document.getElementById(`select-${category}`);
      select.innerHTML = '<option value="">-- Selecciona Modelo --</option>';

      DB[category][brand].forEach((prod, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${prod.name} (${prod.weight}g${prod.carbs > 0 ? ' | ' + prod.carbs + 'g CH' : ''})`;
        select.appendChild(opt);
      });
    }

    function addItem(category) {
      const brand = selectedBrands[category];
      const select = document.getElementById(`select-${category}`);
      const index = select.value;

      if (!brand || index === "") return;

      const prod = DB[category][brand][index];
      userState[category].push({ ...prod, brand });
      
      updateUI();
    }

    function removeItem(category, index) {
      userState[category].splice(index, 1);
      updateUI();
    }

    function updateUI() {
      let totalWeight = 0;
      let totalCarbs = 0;
      let totalSodium = 0;

      ['backpacks', 'gear', 'nutrition'].forEach(cat => {
        const listContainer = document.getElementById(`list-${cat}`);
        listContainer.innerHTML = '';
        
        let catWeight = 0;
        let catCarbs = 0;

        userState[cat].forEach((item, idx) => {
          catWeight += item.weight;
          catCarbs += item.carbs;
          totalWeight += item.weight;
          totalCarbs += item.carbs;
          totalSodium += item.sodium;

          const row = document.createElement('div');
          row.className = 'item-row';
          row.innerHTML = `
            <span><strong>${item.brand}</strong> ${item.name}</span>
            <span>${item.weight}g ${item.carbs > 0 ? '| ' + item.carbs + 'g CH' : ''} 
              <button class="remove-btn" onclick="removeItem('${cat}', ${idx})">✕</button>
            </span>
          `;
          listContainer.appendChild(row);
        });

        // Actualizar badges
        if (cat === 'nutrition') {
          document.getElementById(`badge-${cat}`).textContent = `${catWeight}g | ${catCarbs}g CH`;
        } else {
          document.getElementById(`badge-${cat}`).textContent = `${catWeight}g`;
        }
      });

      // Actualizar Barra Fija
      document.getElementById('total-weight').textContent = `${totalWeight} g`;
      document.getElementById('total-carbs').textContent = `${totalCarbs} g CH`;
      document.getElementById('total-sodium').textContent = `${totalSodium} mg`;
    }

    init();
  </script>
</body>
</html>

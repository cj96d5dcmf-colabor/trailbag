<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrailBag - Mountain Equipment & Nutrition</title>
  <style>
    :root {
      --bg-dark: #121614;
      --card-bg: #1c2820;
      --card-border: #2a382e;
      --accent-orange: #e07a5f;
      --accent-green: #8ba888;
      --text-main: #f2ede4;
      --text-muted: #a3b0a2;
      --input-bg: #16201a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 70px;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      color: var(--accent-orange);
    }

    .lang-selector {
      display: flex;
      gap: 4px;
      background-color: var(--bg-dark);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 5px;
      cursor: pointer;
    }

    .lang-btn.active {
      background-color: var(--accent-orange);
      color: #fff;
    }

    .weight-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px;
      background-color: var(--bg-dark);
    }

    .weight-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .weight-card.highlight {
      border-color: var(--accent-orange);
    }

    .weight-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .weight-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .weight-value span {
      font-size: 0.85rem;
      color: var(--accent-green);
    }

    .view-content {
      display: none;
      padding: 0 16px 16px 16px;
    }

    .view-content.active {
      display: block;
    }

    .brand-catalog-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .brand-catalog-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-green);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .catalog-select {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-add-preset {
      width: 100%;
      background-color: var(--accent-orange);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .category-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-pill.active {
      background-color: var(--accent-green);
      color: var(--bg-dark);
      border-color: var(--accent-green);
      font-weight: 700;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .item-card.selected {
      border-color: var(--accent-green);
      background-color: #213026;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--input-bg);
    }

    .item-card.selected .custom-checkbox {
      background-color: var(--accent-green);
      border-color: var(--accent-green);
    }

    .item-card.selected .custom-checkbox::after {
      content: "✓";
      color: var(--bg-dark);
      font-size: 0.85rem;
      font-weight: 900;
    }

    .item-info {
      display: flex;
      flex-direction: column;
    }

    .item-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .item-tag {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-weight {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-orange);
    }

    .delete-item-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 4px;
    }

    .add-item-btn {
      width: 100%;
      background-color: transparent;
      border: 2px dashed var(--card-border);
      color: var(--accent-green);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .nutrition-results {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }

    .nutri-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
      text-align: center;
    }

    .nutri-box {
      background-color: var(--input-bg);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .nutri-title {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .nutri-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-orange);
      margin-top: 4px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--card-bg);
      border-top: 1px solid var(--card-border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 8px 0;
      z-index: 100;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent-orange);
    }

    .nav-icon {
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">🌲 Trail<span>Bag</span></div>
    <div class="lang-selector">
      <button class="lang-btn active" onclick="setLanguage('es')">ES</button>
      <button class="lang-btn" onclick="setLanguage('eu')">EU</button>
      <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>
  </header>

  <section class="weight-summary">
    <div class="weight-card">
      <div class="weight-label" id="lbl-base-weight">Peso Base</div>
      <div class="weight-value"><span id="val-base-weight">0</span> <span>g</span></div>
    </div>
    <div class="weight-card highlight">
      <div class="weight-label" id="lbl-total-weight">Peso Total</div>
      <div class="weight-value"><span id="val-total-weight">0</span> <span>g</span></div>
    </div>
  </section>

  <main id="view-mochila" class="view-content active">
    <div class="brand-catalog-card">
      <div class="brand-catalog-title" id="lbl-brand-catalog">🏷️ Catálogo de Marcas Top</div>
      <div class="catalog-grid">
        <select class="catalog-select" id="select-brand" onchange="loadBrandProducts()">
          <option value="">-- Marca --</option>
          <option value="Salomon">Salomon</option>
          <option value="RaidLight">RaidLight</option>
          <option value="Compressport">Compressport</option>
          <option value="Petzl">Petzl</option>
          <option value="226ERS">226ERS</option>
          <option value="Maurten">Maurten</option>
          <option value="Fanté">Fanté</option>
          <option value="Naäk">Naäk</option>
          <option value="SiS">SiS</option>
        </select>
        <select class="catalog-select" id="select-product">
          <option value="">-- Elige Modelo --</option>
        </select>
      </div>
      <button class="btn-add-preset" onclick="addPresetItem()" id="btn-add-preset">+ Añadir a Mochila</button>
    </div>

    <div class="category-scroll">
      <button class="cat-pill active" onclick="filterCategory('all')" id="cat-all">Todos</button>
      <button class="cat-pill" onclick="filterCategory('ropa')" id="cat-ropa">Ropa & Abrigo</button>
      <button class="cat-pill" onclick="filterCategory('seguridad')" id="cat-seguridad">Seguridad</button>
      <button class="cat-pill" onclick="filterCategory('hidratacion')" id="cat-hidratacion">Hidratación</button>
      <button class="cat-pill" onclick="filterCategory('nutricion')" id="cat-nutricion">Nutrición</button>
      <button class="cat-pill" onclick="filterCategory('bastones')" id="cat-bastones">Bastones/Varios</button>
    </div>

    <div class="item-list" id="equipment-container"></div>

    <button class="add-item-btn" onclick="addNewItemPrompt()" id="btn-add-item">+ Añadir Nuevo Elemento</button>
  </main>

  <main id="view-nutricion" class="view-content">
    <div class="nutrition-results">
      <div class="form-group">
        <label id="lbl-user-weight">Peso del Corredor (kg):</label>
        <input type="number" id="input-weight" value="70" oninput="calculateNutrition()">
      </div>
      <div class="form-group">
        <label id="lbl-route-dist">Distancia de Ruta (km):</label>
        <input type="number" id="input-dist" value="42" oninput="calculateNutrition()">
      </div>
      <div class="form-group">
        <label id="lbl-est-time">Tiempo Estimado (horas):</label>
        <input type="number" id="input-time" value="6" oninput="calculateNutrition()">
      </div>

      <div class="nutri-grid">
        <div class="nutri-box">
          <div class="nutri-title" id="lbl-carbs">Carbohidratos</div>
          <div class="nutri-val"><span id="val-carbs">60</span> <small>g/h</small></div>
        </div>
        <div class="nutri-box">
          <div class="nutri-title" id="lbl-water">Agua</div>
          <div class="nutri-val"><span id="val-water">500</span> <small>ml/h</small></div>
        </div>
        <div class="nutri-box">
          <div class="nutri-title" id="lbl-sodium">Sodio / Sales</div>
          <div class="nutri-val"><span id="val-sodium">600</span> <small>mg/h</small></div>
        </div>
      </div>

      <div class="nutri-grid" style="margin-top: 12px; border-top: 1px dashed var(--card-border); padding-top: 12px;">
        <div class="nutri-box">
          <div class="nutri-title">CH Cubiertos</div>
          <div class="nutri-val" style="color: var(--accent-green);"><span id="val-carbs-loaded">0</span> <small>g tot</small></div>
        </div>
        <div class="nutri-box">
          <div class="nutri-title">Sodio Cubierto</div>
          <div class="nutri-val" style="color: var(--accent-green);"><span id="val-sodium-loaded">0</span> <small>mg tot</small></div>
        </div>
        <div class="nutri-box">
          <div class="nutri-title">Estado Carga</div>
          <div class="nutri-val" style="font-size:0.85rem;" id="val-nutri-status">Pendiente</div>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('mochila')" id="nav-mochila">
      <span class="nav-icon">🎒</span>
      <span id="nav-lbl-mochila">Mochila</span>
    </button>
    <button class="nav-btn" onclick="switchTab('nutricion')" id="nav-nutricion">
      <span class="nav-icon">🧪</span>
      <span id="nav-lbl-nutricion">Nutrición</span>
    </button>
  </nav>

    };

    let currentLang = 'es';
    let currentCategory = 'all';

    let items = [
      { id: 1, name: { es: "Chaqueta Impermeable 10k/10k", eu: "Jaka Iragazgaitza 10k", en: "Waterproof Jacket 10k" }, weight: 210, category: "ropa", selected: true, consumable: false, carbs: 0, sodium: 0 },

      { id: 8, name: { es: "Maurten GEL 100 (25g CH)", eu: "Maurten GEL 100 (25g CH)", en: "Maurten GEL 100 (25g CH)" }, weight: 40, category: "nutricion", selected: true, consumable: true, carbs: 25, sodium: 20 },

      { id: 10, name: { es: "Bastones Plegables de Carbono", eu: "Karbonozko Makilak", en: "Carbon Folding Poles" }, weight: 280, category: "bastones", selected: false, consumable: false, carbs: 0, sodium: 0 },
      { id: 11, name: { es: "Mallas Térmicas / Pantalón Largo", eu: "Malla Termikoak", en: "Thermal Tights" }, weight: 160, category: "ropa", selected: false, consumable: false, carbs: 0, sodium: 0 },
      { id: 12, name: { es: "Vaso Reutilizable Obligatorio", eu: "Gota Berrerabilgarria", en: "Mandatory Soft Cup" }, weight: 25, category: "hidratacion", selected: true, consumable: false, carbs: 0, sodium: 0 }
    ];

    function init() {
      renderEquipment();
      calculateWeights();
      calculateNutrition();
    }

    function loadBrandProducts() {
      const brand = document.getElementById('select-brand').value;
      const selectProd = document.getElementById('select-product');
      selectProd.innerHTML = '<option value="">-- Elige Modelo --</option>';

      if (!brand || !brandCatalog[brand]) return;

      brandCatalog[brand].forEach((prod, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `${prod.name} (${prod.weight}g)`;
        selectProd.appendChild(opt);
      });
    }

    function addPresetItem() {
      const brand = document.getElementById('select-brand').value;
      const prodIndex = document.getElementById('select-product').value;

      if (!brand || prodIndex === "") return;

      const preset = brandCatalog[brand][prodIndex];
      const newItem = {
        id: Date.now(),
        name: `${brand} ${preset.name}`,
        weight: preset.weight,
        category: preset.category,
        selected: true,
        consumable: preset.consumable,
        carbs: preset.carbs || 0,
        sodium: preset.sodium || 0
      };

      items.push(newItem);
      renderEquipment();
      calculateWeights();
      calculateNutrition();
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const dict = i18n[lang];
      document.getElementById('lbl-base-weight').textContent = dict.baseWeight;
      document.getElementById('lbl-total-weight').textContent = dict.totalWeight;
      document.getElementById('lbl-brand-catalog').textContent = dict.brandCatalogTitle;
      document.getElementById('btn-add-preset').textContent = dict.btnAddPreset;
      document.getElementById('cat-all').textContent = dict.catAll;
      document.getElementById('cat-ropa').textContent = dict.catRopa;
      document.getElementById('cat-seguridad').textContent = dict.catSeguridad;
      document.getElementById('cat-hidratacion').textContent = dict.catHidratacion;
      document.getElementById('cat-nutricion').textContent = dict.catNutricion;
      document.getElementById('cat-bastones').textContent = dict.catBastones;
      document.getElementById('btn-add-item').textContent = dict.addItem;
      document.getElementById('lbl-user-weight').textContent = dict.userWeight;
      document.getElementById('lbl-route-dist').textContent = dict.routeDist;
      document.getElementById('lbl-est-time').textContent = dict.estTime;
      document.getElementById('lbl-carbs').textContent = dict.carbs;
      document.getElementById('lbl-water').textContent = dict.water;
      document.getElementById('lbl-sodium').textContent = dict.sodium;
      document.getElementById('nav-lbl-mochila').textContent = dict.navMochila;
      document.getElementById('nav-lbl-nutricion').textContent = dict.navNutricion;

      renderEquipment();
    }

    function renderEquipment() {
      const container = document.getElementById('equipment-container');
      container.innerHTML = '';

      items.forEach(item => {
        if (currentCategory !== 'all' && item.category !== currentCategory) return;

        const nameText = typeof item.name === 'object' ? (item.name[currentLang] || item.name.es) : item.name;

        const card = document.createElement('div');
        card.className = `item-card ${item.selected ? 'selected' : ''}`;
        
        card.innerHTML = `
          <div class="item-left" onclick="toggleItem(${item.id})">
            <div class="custom-checkbox"></div>
            <div class="item-info">
              <div class="item-name">${nameText}</div>
              <div class="item-tag">${item.consumable ? 'Consumible' : 'Material Base'} ${item.carbs ? '| ' + item.carbs + 'g CH' : ''}</div>
            </div>
          </div>
          <div class="item-right">
            <span class="item-weight">${item.weight} g</span>
            <button class="delete-item-btn" onclick="deleteItem(${item.id})">✕</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleItem(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.selected = !item.selected;
        renderEquipment();
        calculateWeights();
        calculateNutrition();
      }
    }

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      renderEquipment();
      calculateWeights();
      calculateNutrition();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(pill => pill.classList.remove('active'));
      event.target.classList.add('active');
      renderEquipment();
    }

    function calculateWeights() {
      let base = 0;
      let total = 0;

      items.forEach(item => {
        if (item.selected) {
          total += item.weight;
          if (!item.consumable) {
            base += item.weight;
          }
        }
      });

      document.getElementById('val-base-weight').textContent = base;
      document.getElementById('val-total-weight').textContent = total;
    }

    function calculateNutrition() {
      const weight = parseFloat(document.getElementById('input-weight').value) || 70;
      const hours = parseFloat(document.getElementById('input-time').value) || 1;

      const targetCarbsPerHour = Math.min(90, Math.max(30, Math.round(weight * 0.85)));
      const water = Math.round(weight * 7.5);
      const sodium = 600;

      const totalTargetCarbs = targetCarbsPerHour * hours;

      let loadedCarbs = 0;
      let loadedSodium = 0;

      items.forEach(item => {
        if (item.selected) {
          loadedCarbs += item.carbs || 0;
          loadedSodium += item.sodium || 0;
        }
      });

      document.getElementById('val-carbs').textContent = targetCarbsPerHour;
      document.getElementById('val-water').textContent = water;
      document.getElementById('val-sodium').textContent = sodium;

      document.getElementById('val-carbs-loaded').textContent = loadedCarbs;
      document.getElementById('val-sodium-loaded').textContent = loadedSodium;

      const statusEl = document.getElementById('val-nutri-status');
      if (loadedCarbs >= totalTargetCarbs) {
        statusEl.textContent = "OK (Cubierto)";
        statusEl.style.color = "var(--accent-green)";
      } else {
        statusEl.textContent = `Faltan ${totalTargetCarbs - loadedCarbs}g`;
        statusEl.style.color = "var(--accent-orange)";
      }
    }

    function addNewItemPrompt() {
      const dict = i18n[currentLang];
      const name = prompt(dict.promptName);
      if (!name) return;
      const weight = parseInt(prompt(dict.promptWeight, "100"));
      if (isNaN(weight)) return;
      const isConsumable = confirm(dict.isConsumable);

      const newItem = {
        id: Date.now(),
        name: name,
        weight: weight,
        category: "bastones",
        selected: true,
        consumable: isConsumable,
        carbs: 0,
        sodium: 0
      };

      items.push(newItem);
      renderEquipment();
      calculateWeights();
      calculateNutrition();
    }

    function switchTab(tab) {
      document.querySelectorAll('.view-content').forEach(view => view.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      if (tab === 'mochila') {
        document.getElementById('view-mochila').classList.add('active');
        document.getElementById('nav-mochila').classList.add('active');
      } else {
        document.getElementById('view-nutricion').classList.add('active');
        document.getElementById('nav-nutricion').classList.add('active');
      }
    }

    window.onload = init;
  </script>
</body>
</html>
